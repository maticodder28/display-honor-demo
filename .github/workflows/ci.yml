name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # La compilacion de CI usa el modo demo: no necesita credenciales de Supabase.
      NEXT_PUBLIC_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Sin simbolos Unicode
        run: npm run lint:unicode
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Instalar navegador para pruebas
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo y accesibilidad
        run: npm run test:e2e
      - name: Guardar reporte si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: test-results/
          retention-days: 7
